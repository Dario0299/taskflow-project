<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Panel de Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen font-sans antialiased py-8 px-4">

    <header>
        <h1>TaskFlow</h1>
        <p>Dashboard de Tareas</p>
    </header>

    <main class="max-w-6xl mx-auto md:grid md:grid-cols-4 md:gap-6 space-y-6 md:space-y-0">
        
        <aside class="md:col-span-1 space-y-6">
            
            <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200 text-center">
                <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Tareas Totales</h3>
                <span id="total-tasks" class="block text-4xl font-extrabold text-gray-900 mt-2">0</span>
            </div>

            <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200 text-center">
                <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Pendientes</h3>
                <span id="pending-tasks" class="block text-4xl font-extrabold text-amber-500 mt-2">0</span>
            </div>

            <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200 text-center">
                <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Completadas</h3>
                <span id="completed-tasks" class="block text-4xl font-extrabold text-green-500 mt-2">0</span>
            </div>

            <section id="input-section" class="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
                <form id="task-form" class="space-y-4">
                    <label for="task-input" class="block text-sm font-medium text-gray-700">Nueva Tarea:</label>
                    <input type="text" id="task-input" placeholder="¿Qué hay que hacer?" required
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                    <button type="submit" id="submit-task-btn" 
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg text-sm transition-colors shadow-sm">
                        + Añadir Tarea
                    </button>
                </form>
            </section>
        </aside>

        <div class="md:col-span-3 space-y-4">
            
            <section id="filters-section" class="flex gap-2">
                <button id="filter-all" class="bg-blue-600 text-white text-xs font-semibold px-4 py-2 rounded-lg shadow-sm">Todas</button>
                <button id="filter-pending" class="bg-white text-gray-600 border border-gray-200 hover:bg-gray-50 text-xs font-semibold px-4 py-2 rounded-lg shadow-sm transition-colors">Pendientes</button>
                <button id="filter-completed" class="bg-white text-gray-600 border border-gray-200 hover:bg-gray-50 text-xs font-semibold px-4 py-2 rounded-lg shadow-sm transition-colors">Completadas</button>
            </section>

            <section id="list-section" class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 min-h-[300px]">
                <ul id="task-list" class="divide-y divide-gray-100">
                    </ul>

                <template id="task-template">
                    <li class="task-item flex items-center justify-between py-3">
                        <div class="task-content flex items-center gap-3">
                            <input type="checkbox" class="task-checkbox h-4 w-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500 cursor-pointer">
                            <span class="task-text text-sm font-medium text-gray-700"></span>
                        </div>
                        <button class="delete-btn text-gray-400 hover:text-red-500 p-1 rounded-lg hover:bg-gray-50 transition-colors" aria-label="Eliminar tarea">
                            🗑️
                        </button>
                    </li>
                </template>
            </section>
        </div>

    </main>

</body>
</html>
