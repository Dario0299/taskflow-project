<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Panel de Control</title>
</head>
<body>

    <header>
        <h1>TaskFlow</h1>
        <p>Dashboard de Tareas</p>
    </header>

    <main>

        <section id="stats-section">
            <div class="stat-card">
                <h3>Tareas Totales</h3>
                <span id="total-tasks">0</span>
            </div>
            <div class="stat-card">
                <h3>Pendientes</h3>
                <span id="pending-tasks">0</span>
            </div>
            <div class="stat-card">
                <h3>Completadas</h3>
                <span id="completed-tasks">0</span>
            </div>
        </section>

        <section id="input-section">
            <form id="task-form">
                <label for="task-input">Nueva Tarea:</label>
                <input type="text" id="task-input" placeholder="¿Qué hay que hacer?" required>
                <button type="submit">+ Añadir Tarea</button>
            </form>
        </section>

        <section id="filters-section">
            <button id="filter-all" class="active">Todas</button>
            <button id="filter-pending">Pendientes</button>
            <button id="filter-completed">Completadas</button>
        </section>

        <section id="list-section">
            <ul id="task-list">
                </ul>
        </section>

    </main>

</body>
</html>
